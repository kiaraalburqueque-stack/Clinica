<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/app.css}"><title>Gestión de Usuarios</title></head><body><header th:replace="~{fragments :: header}"></header><main>
 <p class="eyebrow">ADMINISTRACIÓN</p><h1 th:text="${id==null?'Registrar':'Editar'}+' usuarios'"></h1><form class="clinical-form" th:object="${form}" th:action="${id==null?'/admin/usuarios':'/admin/usuarios/'+id}" method="post"><div class="alert error wide" th:if="${#fields.hasAnyErrors()}"><ul><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul></div><input type="hidden" th:field="*{version}"><div class="field"><label for="username">Usuario</label><input id="username" type="text" th:field="*{username}" maxlength="40" required></div><div class="field"><label for="nombre">Nombre completo</label><input id="nombre" type="text" th:field="*{nombre}" maxlength="100" required></div><div class="field"><label for="correo">Correo electrónico</label><input id="correo" type="email" th:field="*{correo}" maxlength="200" required></div><div class="field"><label for="password">Contraseña (al editar, vacía para conservarla)</label><input id="password" name="password" type="password" autocomplete="new-password" maxlength="72" th:required="${id==null}"><small>Mínimo 8 caracteres, letras y números.</small></div><fieldset class="wide"><legend>Roles asignados</legend><label class="check" th:each="r:${roles}"><input type="checkbox" th:field="*{rolIds}" th:value="${r.id}"><span th:text="${r.nombre}"></span></label></fieldset><label class="check wide"><input type="checkbox" th:field="*{activo}">Activo</label><div class="actions wide"><button class="button" type="submit">Guardar</button><a class="button secondary" th:href="@{/admin/usuarios}">Cancelar</a></div></form>
 </main><footer th:replace="~{fragments :: footer}"></footer></body></html>

<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/app.css}"><title>Gestión de Roles</title></head><body><header th:replace="~{fragments :: header}"></header><main>
 <p class="eyebrow">ADMINISTRACIÓN</p><h1 th:text="${id==null?'Registrar':'Editar'}+' roles'"></h1><form class="clinical-form" th:object="${form}" th:action="${id==null?'/admin/roles':'/admin/roles/'+id}" method="post"><div class="alert error wide" th:if="${#fields.hasAnyErrors()}"><ul><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul></div><input type="hidden" th:field="*{version}"><div class="field"><label for="codigo">Código (mayúsculas)</label><input id="codigo" type="text" th:field="*{codigo}" maxlength="40" required></div><div class="field"><label for="nombre">Nombre del rol</label><input id="nombre" type="text" th:field="*{nombre}" maxlength="100" required></div><div class="field"><label for="descripcion">Descripción</label><input id="descripcion" type="text" th:field="*{descripcion}" maxlength="500" ></div><fieldset class="wide"><legend>Permisos del rol</legend><label class="check" th:each="p:${permisos}"><input type="checkbox" th:field="*{permisos}" th:value="${p}"><span th:text="${p.etiqueta}"></span></label><small>Los permisos autorizan operaciones en el servidor y controlan las opciones visibles.</small></fieldset><label class="check wide"><input type="checkbox" th:field="*{activo}">Activo</label><div class="actions wide"><button class="button" type="submit">Guardar</button><a class="button secondary" th:href="@{/admin/roles}">Cancelar</a></div></form>
 </main><footer th:replace="~{fragments :: footer}"></footer></body></html>

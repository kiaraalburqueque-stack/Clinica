<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/app.css}"><title>Roles</title></head><body><header th:replace="~{fragments :: header}"></header><main>
 <p class="eyebrow">ADMINISTRACIÓN · EVALUACIÓN 2</p><div class="page-title"><div><h1>Roles</h1><p>Gestiona el acceso al sistema. Las operaciones quedan auditadas.</p></div><a class="button" th:href="@{/admin/roles/nuevo}">+ Registrar</a></div><div class="alert" th:if="${mensaje}" th:text="${mensaje}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div><div class="table-wrap"><table><thead><tr><th>Código</th><th>Nombre / descripción</th><th>Permisos</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="e:${elementos}"><td th:text="${e.codigo}"></td><td><b th:text="${e.nombre}"></b><small th:text="${e.descripcion}"></small></td><td><small th:each="p:${e.permisos}" th:text="${p.etiqueta}"></small></td><td><span class="badge" th:classappend="${e.activo?'':'inactive'}" th:text="${e.activo?'Activo':'Inactivo'}"></span></td><td><div class="actions"><a class="button secondary" th:href="@{/admin/roles/{id}/editar(id=${e.id})}">Editar</a><form th:action="@{/admin/roles/{id}/estado(id=${e.id})}" method="post"><input type="hidden" name="activo" th:value="${!e.activo}"><input type="hidden" name="version" th:value="${e.version}"><button class="quiet" th:text="${e.activo?'Desactivar':'Activar'}"></button></form></div></td></tr><tr th:if="${elementos.isEmpty()}"><td colspan="5" class="empty">Sin registros.</td></tr></tbody></table></div>
 </main><footer th:replace="~{fragments :: footer}"></footer></body></html>

<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/app.css}"><title th:text="${titulo}"></title></head><body><header th:replace="~{fragments :: header}"></header><main><section th:replace="~{fragments :: paciente}"></section><p class="eyebrow" th:text="${requisitos}"></p><h1 th:text="${id==null?'Registrar '+titulo:'Corregir '+titulo}"></h1><p>Los campos con * son obligatorios. El responsable se registra desde tu sesión.</p>
<form class="clinical-form" th:object="${form}" th:action="${id==null?'/pacientes/'+paciente.id+'/valoraciones':'/pacientes/'+paciente.id+'/valoraciones/'+id}" method="post"><div class="alert error wide" th:if="${#fields.hasAnyErrors()}"><p>Revisa los datos antes de guardar:</p><ul><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div><input type="hidden" th:field="*{version}"><div class="field"><label for="fechaHora">Fecha y hora (Lima) *</label><input id="fechaHora" type="datetime-local" th:field="*{fechaHora}" required></div><div class="field"><label>Responsable</label><input th:value="${profesional.nombre}" readonly></div><div class="field "><label for="estadoGeneral">Estado general *</label><input id="estadoGeneral" type="text" th:field="*{estadoGeneral}" maxlength="200" required><span class="field-error" th:if="${#fields.hasErrors('estadoGeneral')}" th:errors="*{estadoGeneral}"></span></div><div class="field "><label for="conciencia">Estado de conciencia *</label><input id="conciencia" type="text" th:field="*{conciencia}" maxlength="200" required><span class="field-error" th:if="${#fields.hasErrors('conciencia')}" th:errors="*{conciencia}"></span></div><div class="field "><label for="dolor">Dolor (0–10)</label><input id="dolor" type="number" th:field="*{dolor}" step="1" min="0" max="10"><span class="field-error" th:if="${#fields.hasErrors('dolor')}" th:errors="*{dolor}"></span></div><div class="field "><label for="movilidad">Movilidad</label><input id="movilidad" type="text" th:field="*{movilidad}" maxlength="200"><span class="field-error" th:if="${#fields.hasErrors('movilidad')}" th:errors="*{movilidad}"></span></div><div class="field "><label for="alimentacion">Alimentación</label><input id="alimentacion" type="text" th:field="*{alimentacion}" maxlength="200"><span class="field-error" th:if="${#fields.hasErrors('alimentacion')}" th:errors="*{alimentacion}"></span></div><div class="field "><label for="higiene">Higiene</label><input id="higiene" type="text" th:field="*{higiene}" maxlength="200"><span class="field-error" th:if="${#fields.hasErrors('higiene')}" th:errors="*{higiene}"></span></div><div class="field "><label for="piel">Estado de piel</label><input id="piel" type="text" th:field="*{piel}" maxlength="200"><span class="field-error" th:if="${#fields.hasErrors('piel')}" th:errors="*{piel}"></span></div><div class="field "><label for="riesgoCaida">Riesgo de caída</label><select id="riesgoCaida" th:field="*{riesgoCaida}"><option value="">Seleccionar</option><option value="No evaluado">No evaluado</option><option value="Bajo">Bajo</option><option value="Medio">Medio</option><option value="Alto">Alto</option></select><span class="field-error" th:if="${#fields.hasErrors('riesgoCaida')}" th:errors="*{riesgoCaida}"></span></div><div class="field "><label for="riesgoLesiones">Riesgo de lesiones por presión</label><select id="riesgoLesiones" th:field="*{riesgoLesiones}"><option value="">Seleccionar</option><option value="No evaluado">No evaluado</option><option value="Bajo">Bajo</option><option value="Medio">Medio</option><option value="Alto">Alto</option></select><span class="field-error" th:if="${#fields.hasErrors('riesgoLesiones')}" th:errors="*{riesgoLesiones}"></span></div><div class="field wide"><label for="necesidades">Necesidades de cuidado *</label><textarea id="necesidades" th:field="*{necesidades}" rows="4" maxlength="4000" required></textarea><span class="field-error" th:if="${#fields.hasErrors('necesidades')}" th:errors="*{necesidades}"></span></div><div class="field wide"><label for="observaciones">Observaciones</label><textarea id="observaciones" th:field="*{observaciones}" rows="4" maxlength="4000"></textarea><span class="field-error" th:if="${#fields.hasErrors('observaciones')}" th:errors="*{observaciones}"></span></div><div class="field wide" th:if="${id!=null}"><label for="motivoCambio">Motivo de la corrección *</label><textarea id="motivoCambio" th:field="*{motivoCambio}" required maxlength="1000"></textarea></div><div class="actions wide"><button class="button" type="submit">Guardar registro</button><a class="button secondary" th:href="@{/pacientes/{id}/valoraciones(id=${paciente.id})}">Cancelar</a></div></form></main><footer th:replace="~{fragments :: footer}"></footer></body></html>

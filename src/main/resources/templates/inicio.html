<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/app.css}"><title>Pacientes asignados</title></head><body><header th:replace="~{fragments :: header}"></header><main><p class="eyebrow">RF-ENF-06 · PANEL DE ENFERMERÍA</p><div class="page-title"><div><h1>Pacientes asignados</h1><p>Consulta tu turno y abre la ficha para registrar cuidados.</p></div><span class="count" th:text="${asignaciones.size()+' asignaciones'}"></span></div>
<form class="filters" th:action="@{/}" method="get"><label>Fecha<input type="date" name="fecha" th:value="${fecha}" required></label><label>Turno<select name="turno"><option value="">Todos</option><option th:each="t : ${ {'Mañana','Tarde','Noche'} }" th:value="${t}" th:text="${t}" th:selected="${t==turno}"></option></select></label><label>Servicio<select name="servicio"><option value="">Todos</option><option th:each="s : ${ {'Medicina interna','Cirugía'} }" th:value="${s}" th:text="${s}" th:selected="${s==servicio}"></option></select></label><label>Buscar<input name="buscar" placeholder="Nombre, documento o código" th:value="${buscar}"></label><label th:if="${profesionales!=null}">Profesional<select name="profesionalId"><option value="">Mis asignaciones</option><option th:each="p : ${profesionales}" th:value="${p.id}" th:text="${p.nombre}" th:selected="${p.id==profesionalId}"></option></select></label><button class="button" type="submit">Consultar</button></form>
<div class="table-wrap"><table><thead><tr><th>Paciente</th><th>Documento</th><th>Turno / servicio</th><th>Habitación / cama</th><th>Responsable</th><th></th></tr></thead><tbody><tr th:each="a : ${asignaciones}"><td><strong th:text="${a.paciente}"></strong><small th:text="${a.codigo}"></small></td><td th:text="${a.documento}"></td><td><span th:text="${a.turno}"></span><small th:text="${a.servicio}"></small></td><td th:text="${a.habitacion+' / '+a.cama}"></td><td th:text="${a.profesional}"></td><td><a class="button secondary" th:href="@{/pacientes/{id}(id=${a.pacienteId})}">Abrir ficha</a></td></tr><tr th:if="${asignaciones.isEmpty()}"><td colspan="6" class="empty">No hay pacientes asignados con estos filtros. Puedes consultar otra fecha.</td></tr></tbody></table></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>

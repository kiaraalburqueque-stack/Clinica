<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/app.css}"><title th:text="${titulo}"></title></head><body><header th:replace="~{fragments :: header}"></header><main><section th:replace="~{fragments :: paciente}"></section><p class="eyebrow" th:text="${requisitos}"></p><h1 th:text="${id==null?'Registrar '+titulo:'Corregir '+titulo}"></h1><p>Los campos con * son obligatorios. El responsable se registra desde tu sesión.</p>
<form class="clinical-form" th:object="${form}" th:action="${id==null?'/pacientes/'+paciente.id+'/procedimientos':'/pacientes/'+paciente.id+'/procedimientos/'+id}" method="post"><div class="alert error wide" th:if="${#fields.hasAnyErrors()}"><p>Revisa los datos antes de guardar:</p><ul><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div><input type="hidden" th:field="*{version}"><div class="field"><label for="fechaHora">Fecha y hora (Lima) *</label><input id="fechaHora" type="datetime-local" th:field="*{fechaHora}" required></div><div class="field"><label>Responsable</label><input th:value="${profesional.nombre}" readonly></div><div class="field "><label for="tipo">Procedimiento *</label><select id="tipo" th:field="*{tipo}"><option value="">Seleccionar</option><option value="Curación">Curación</option><option value="Cambio de posición">Cambio de posición</option><option value="Higiene">Higiene</option><option value="Control de glucosa">Control de glucosa</option><option value="Administración de oxígeno">Administración de oxígeno</option><option value="Colocación de dispositivo">Colocación de dispositivo</option><option value="Retiro de dispositivo">Retiro de dispositivo</option><option value="Otros">Otros</option></select><span class="field-error" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></span></div><div class="field wide"><label for="descripcion">Descripción de otros cuidados</label><textarea id="descripcion" th:field="*{descripcion}" rows="4" maxlength="4000"></textarea><span class="field-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span></div><div class="field wide"><label for="resultado">Resultado *</label><textarea id="resultado" th:field="*{resultado}" rows="4" maxlength="4000" required></textarea><span class="field-error" th:if="${#fields.hasErrors('resultado')}" th:errors="*{resultado}"></span></div><div class="field wide"><label for="observaciones">Observaciones</label><textarea id="observaciones" th:field="*{observaciones}" rows="4" maxlength="4000"></textarea><span class="field-error" th:if="${#fields.hasErrors('observaciones')}" th:errors="*{observaciones}"></span></div><div class="field wide" th:if="${id!=null}"><label for="motivoCambio">Motivo de la corrección *</label><textarea id="motivoCambio" th:field="*{motivoCambio}" required maxlength="1000"></textarea></div><div class="actions wide"><button class="button" type="submit">Guardar registro</button><a class="button secondary" th:href="@{/pacientes/{id}/procedimientos(id=${paciente.id})}">Cancelar</a></div></form></main><footer th:replace="~{fragments :: footer}"></footer></body></html>

<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/app.css}"><title>Consulta de pacientes</title></head><body><header th:replace="~{fragments :: header}"></header><main>
<p class="eyebrow">CONSULTA DE PACIENTES</p><h1>Pacientes</h1><p>Los datos clínicos están disponibles únicamente con el permiso correspondiente.</p><form class="filters" method="get"><label>Buscar paciente<input name="buscar" th:value="${buscar}" placeholder="Nombre, documento o código"></label><button class="button">Buscar</button></form><div class="table-wrap"><table><thead><tr><th>Código</th><th>Paciente</th><th>Documento</th><th>Acciones</th></tr></thead><tbody><tr th:each="p:${pacientes}"><td th:text="${p.codigo}"></td><td th:text="${p.nombre}"></td><td th:text="${p.documento}"></td><td><div class="actions"><a class="button secondary" th:href="@{/pacientes/{id}/datos(id=${p.id})}">Datos personales</a><a class="button" th:if="${puedeCONSULTA_CLINICA}" th:href="@{/pacientes/{id}(id=${p.id})}">Ficha clínica</a></div></td></tr><tr th:if="${pacientes.isEmpty()}"><td colspan="4" class="empty">Sin pacientes con estos filtros.</td></tr></tbody></table></div>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>

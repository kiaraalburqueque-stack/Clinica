<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/app.css}"><title>Datos del paciente</title></head><body><header th:replace="~{fragments :: header}"></header><main><p class="eyebrow">DATOS PERSONALES</p><h1 th:text="${paciente.nombre}"></h1><dl class="panel record-data"><div><dt>Código</dt><dd th:text="${paciente.codigo}"></dd></div><div><dt>Documento</dt><dd th:text="${paciente.documento}"></dd></div><div><dt>Fecha de nacimiento</dt><dd th:text="${paciente.nacimiento}"></dd></div><div><dt>Sexo</dt><dd th:text="${paciente.sexo}"></dd></div></dl><a class="button secondary" th:href="@{/pacientes}">Volver al listado</a></main><footer th:replace="~{fragments :: footer}"></footer></body></html>

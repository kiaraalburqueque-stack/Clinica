<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/app.css}"><title th:text="${titulo}"></title></head><body><header th:replace="~{fragments :: header}"></header><main><section th:replace="~{fragments :: paciente}"></section><p class="eyebrow" th:text="${requisitos}"></p><div class="page-title"><div><h1 th:text="${titulo}"></h1><p>Historial del paciente · Los registros anulados se conservan.</p></div><a class="button" th:href="@{/pacientes/{id}/notas/nuevo(id=${paciente.id})}">+ Registrar</a></div><div class="alert" th:if="${mensaje}" th:text="${mensaje}"></div><form class="filters" method="get"><label>Desde<input type="date" name="desde" th:value="${desde}"></label><label>Hasta<input type="date" name="hasta" th:value="${hasta}"></label><button class="button" type="submit">Filtrar</button><a class="back" th:href="@{/pacientes/{id}/notas(id=${paciente.id})}">Limpiar</a></form>
<div class="empty panel" th:if="${registros.empty}">No hay registros para este paciente con los filtros seleccionados.</div><article class="record panel" th:each="r : ${registros.content}" th:classappend="${r.anulado?'annulled':''}"><div class="record-head"><div><strong th:text="${#temporals.format(r.fechaHora,'dd/MM/yyyy HH:mm')}"></strong><small th:text="${r.profesional.nombre}"></small></div><span class="badge" th:text="${r.anulado?'Anulado':'Registrado'}"></span></div><dl class="record-data"><div><dt>Actividades y observaciones</dt><dd th:text="${r.contenido!=null && r.contenido.toString()!=''?r.contenido:'No registrado'}"></dd></div></dl><p class="alert error" th:if="${r.anulado}" th:text="${'Motivo de anulación: '+r.motivoAnulacion}"></p><div class="actions" th:unless="${r.anulado}"><a class="button secondary" th:href="@{/pacientes/{pid}/notas/{id}/editar(pid=${paciente.id},id=${r.id})}">Corregir</a><details class="annul"><summary>Anular registro</summary><form th:action="@{/pacientes/{pid}/notas/{id}/anular(pid=${paciente.id},id=${r.id})}" method="post"><label>Motivo de anulación<input name="motivo" required maxlength="1000"></label><button class="button danger" type="submit">Confirmar anulación</button></form></details></div></article><nav class="pagination"><a class="button secondary" th:if="${registros.hasPrevious()}" th:href="@{/pacientes/{id}/notas(id=${paciente.id},page=${registros.number-1},desde=${desde},hasta=${hasta})}">Anterior</a><span th:text="${'Página '+(registros.number+1)+' · '+registros.totalElements+' registros'}"></span><a class="button secondary" th:if="${registros.hasNext()}" th:href="@{/pacientes/{id}/notas(id=${paciente.id},page=${registros.number+1},desde=${desde},hasta=${hasta})}">Siguiente</a></nav></main><footer th:replace="~{fragments :: footer}"></footer></body></html>

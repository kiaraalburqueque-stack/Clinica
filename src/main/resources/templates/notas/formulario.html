<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/app.css}"><title th:text="${titulo}"></title></head><body><header th:replace="~{fragments :: header}"></header><main><section th:replace="~{fragments :: paciente}"></section><p class="eyebrow" th:text="${requisitos}"></p><h1 th:text="${id==null?'Registrar '+titulo:'Corregir '+titulo}"></h1><p>Los campos con * son obligatorios. El responsable se registra desde tu sesión.</p>
<form class="clinical-form" th:object="${form}" th:action="${id==null?'/pacientes/'+paciente.id+'/notas':'/pacientes/'+paciente.id+'/notas/'+id}" method="post"><div class="alert error wide" th:if="${#fields.hasAnyErrors()}"><p>Revisa los datos antes de guardar:</p><ul><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div><input type="hidden" th:field="*{version}"><div class="field"><label for="fechaHora">Fecha y hora (Lima) *</label><input id="fechaHora" type="datetime-local" th:field="*{fechaHora}" required></div><div class="field"><label>Responsable</label><input th:value="${profesional.nombre}" readonly></div><div class="field wide"><label for="contenido">Actividades y observaciones *</label><textarea id="contenido" th:field="*{contenido}" rows="4" maxlength="8000" required></textarea><span class="field-error" th:if="${#fields.hasErrors('contenido')}" th:errors="*{contenido}"></span></div><div class="field wide" th:if="${id!=null}"><label for="motivoCambio">Motivo de la corrección *</label><textarea id="motivoCambio" th:field="*{motivoCambio}" required maxlength="1000"></textarea></div><div class="actions wide"><button class="button" type="submit">Guardar registro</button><a class="button secondary" th:href="@{/pacientes/{id}/notas(id=${paciente.id})}">Cancelar</a></div></form></main><footer th:replace="~{fragments :: footer}"></footer></body></html>

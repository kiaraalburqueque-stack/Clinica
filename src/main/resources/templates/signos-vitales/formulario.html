<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/app.css}"><title th:text="${titulo}"></title></head><body><header th:replace="~{fragments :: header}"></header><main><section th:replace="~{fragments :: paciente}"></section><p class="eyebrow" th:text="${requisitos}"></p><h1 th:text="${id==null?'Registrar '+titulo:'Corregir '+titulo}"></h1><p>Los campos con * son obligatorios. El responsable se registra desde tu sesión.</p>
<form class="clinical-form" th:object="${form}" th:action="${id==null?'/pacientes/'+paciente.id+'/signos-vitales':'/pacientes/'+paciente.id+'/signos-vitales/'+id}" method="post"><div class="alert error wide" th:if="${#fields.hasAnyErrors()}"><p>Revisa los datos antes de guardar:</p><ul><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div><input type="hidden" th:field="*{version}"><div class="field"><label for="fechaHora">Fecha y hora (Lima) *</label><input id="fechaHora" type="datetime-local" th:field="*{fechaHora}" required></div><div class="field"><label>Responsable</label><input th:value="${profesional.nombre}" readonly></div><div class="field "><label for="temperatura">Temperatura (°C)</label><input id="temperatura" type="number" th:field="*{temperatura}" step="0.1" min="0"><span class="field-error" th:if="${#fields.hasErrors('temperatura')}" th:errors="*{temperatura}"></span></div><div class="field "><label for="sistolica">Presión sistólica (mmHg)</label><input id="sistolica" type="number" th:field="*{sistolica}" step="1" min="1"><span class="field-error" th:if="${#fields.hasErrors('sistolica')}" th:errors="*{sistolica}"></span></div><div class="field "><label for="diastolica">Presión diastólica (mmHg)</label><input id="diastolica" type="number" th:field="*{diastolica}" step="1" min="1"><span class="field-error" th:if="${#fields.hasErrors('diastolica')}" th:errors="*{diastolica}"></span></div><div class="field "><label for="frecuenciaCardiaca">Frecuencia cardíaca (latidos/min)</label><input id="frecuenciaCardiaca" type="number" th:field="*{frecuenciaCardiaca}" step="1" min="1"><span class="field-error" th:if="${#fields.hasErrors('frecuenciaCardiaca')}" th:errors="*{frecuenciaCardiaca}"></span></div><div class="field "><label for="frecuenciaRespiratoria">Frecuencia respiratoria (resp/min)</label><input id="frecuenciaRespiratoria" type="number" th:field="*{frecuenciaRespiratoria}" step="1" min="1"><span class="field-error" th:if="${#fields.hasErrors('frecuenciaRespiratoria')}" th:errors="*{frecuenciaRespiratoria}"></span></div><div class="field "><label for="saturacion">Saturación de oxígeno (%)</label><input id="saturacion" type="number" th:field="*{saturacion}" step="0.1" min="0" max="100"><span class="field-error" th:if="${#fields.hasErrors('saturacion')}" th:errors="*{saturacion}"></span></div><div class="field "><label for="peso">Peso (kg)</label><input id="peso" type="number" th:field="*{peso}" step="0.1" min="0.1"><span class="field-error" th:if="${#fields.hasErrors('peso')}" th:errors="*{peso}"></span></div><div class="field "><label for="talla">Talla (cm)</label><input id="talla" type="number" th:field="*{talla}" step="0.1" min="0.1"><span class="field-error" th:if="${#fields.hasErrors('talla')}" th:errors="*{talla}"></span></div><div class="field "><label for="dolor">Dolor (0–10)</label><input id="dolor" type="number" th:field="*{dolor}" step="1" min="0" max="10"><span class="field-error" th:if="${#fields.hasErrors('dolor')}" th:errors="*{dolor}"></span></div><div class="field "><label for="glucosa">Glucosa (mg/dL)</label><input id="glucosa" type="number" th:field="*{glucosa}" step="0.1" min="0"><span class="field-error" th:if="${#fields.hasErrors('glucosa')}" th:errors="*{glucosa}"></span></div><div class="field wide" th:if="${id!=null}"><label for="motivoCambio">Motivo de la corrección *</label><textarea id="motivoCambio" th:field="*{motivoCambio}" required maxlength="1000"></textarea></div><div class="actions wide"><button class="button" type="submit">Guardar registro</button><a class="button secondary" th:href="@{/pacientes/{id}/signos-vitales(id=${paciente.id})}">Cancelar</a></div></form></main><footer th:replace="~{fragments :: footer}"></footer></body></html>

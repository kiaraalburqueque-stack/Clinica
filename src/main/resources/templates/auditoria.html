<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" th:href="@{/css/app.css}"><title>Bitácora de auditoría</title></head><body><header th:replace="~{fragments :: header}"></header><main>
<p class="eyebrow">TRAZABILIDAD · AOP</p><h1>Bitácora de auditoría</h1><p>Operaciones registradas automáticamente junto con los cambios de datos.</p><form class="filters" method="get"><label>Usuario<input name="usuario" th:value="${usuario}"></label><label>Entidad<input name="entidad" th:value="${entidad}" placeholder="Usuario, Rol, SignoVital…"></label><label>Operación<input name="accion" th:value="${accion}" placeholder="CREAR, MODIFICAR…"></label><label>Desde<input type="date" name="desde" th:value="${desde}"></label><label>Hasta<input type="date" name="hasta" th:value="${hasta}"></label><button class="button">Filtrar</button></form><div class="table-wrap"><table><thead><tr><th>Fecha / hora</th><th>Usuario</th><th>Operación</th><th>Entidad / ID</th><th>Detalle</th></tr></thead><tbody><tr th:each="a:${registros.content}"><td th:text="${#temporals.format(a.fechaHora,'dd/MM/yyyy HH:mm:ss')}"></td><td th:text="${a.usuario}"></td><td th:text="${a.accion}"></td><td th:text="${a.tipo+' / '+a.registroId}"></td><td><details th:if="${a.datosAnteriores!=null || a.motivo!=null}"><summary>Ver detalle</summary><p th:if="${a.motivo!=null}" th:text="${a.motivo}"></p><pre th:if="${a.datosAnteriores!=null}" th:text="${a.datosAnteriores}"></pre></details><span th:if="${a.datosAnteriores==null && a.motivo==null}">Registro creado</span></td></tr><tr th:if="${registros.empty}"><td colspan="5" class="empty">No hay operaciones con estos filtros.</td></tr></tbody></table></div><nav class="pagination"><a class="button secondary" th:if="${registros.hasPrevious()}" th:href="@{/auditoria(page=${registros.number-1},usuario=${usuario},entidad=${entidad},accion=${accion},desde=${desde},hasta=${hasta})}">Anterior</a><span th:text="${'Página '+(registros.number+1)+' · '+registros.totalElements+' operaciones'}"></span><a class="button secondary" th:if="${registros.hasNext()}" th:href="@{/auditoria(page=${registros.number+1},usuario=${usuario},entidad=${entidad},accion=${accion},desde=${desde},hasta=${hasta})}">Siguiente</a></nav>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
